<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecovia: Civilización Viva - Grid Logic & Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #111; color: #fff; display: flex; flex-direction: column; }
        
        #hud {
            height: 60px;
            background: rgba(18, 18, 18, 0.9);
            border-bottom: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 10;
        }
        .resource-badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #build-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 16px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .build-btn {
            background: linear-gradient(135deg, #2c2c2c, #1f1f1f);
            border: 1px solid #444;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }
        .build-btn:hover, .build-btn.active {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-color: #90e0ef;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="resource-badge">⚡ Energía: <span id="res-energy">7240</span></div>
        <div class="resource-badge">🌿 Sostenibilidad: <span id="res-sustainability">70%</span></div>
        <div class="resource-badge">🏭 Contaminación: <span id="res-pollution">0%</span></div>
        <div class="resource-badge">💎 Créditos: <span id="res-credits">50000</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="build-menu">
        <button class="build-btn active" onclick="selectTool('vacio')">🧹 Borrar</button>
        <button class="build-btn" onclick="selectTool('carretera')">🛣️ Carretera</button>
        <button class="build-btn" onclick="selectTool('residencial')">🏠 Residencial</button>
        <button class="build-btn" onclick="selectTool('comercial')">🏢 Comercial</button>
        <button class="build-btn" onclick="selectTool('eolica')">🌬️ Eólica</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const tileSize = 50;
        let cols = 0;
        let rows = 0;
        let mapGrid = [];
        let currentTool = 'carretera';

        // Definición de colores según el tipo de celda/edificio
        const buildingColors = {
            'vacio': null,
            'carretera': '#555555',
            'residencial': '#2a9d8f',
            'comercial': '#e76f51',
            'eolica': '#e9c46a'
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            cols = Math.ceil(canvas.width / tileSize);
            rows = Math.ceil(canvas.height / tileSize);
            
            // Inicializar o redimensionar la matriz manteniendo datos previos si es posible
            let oldGrid = mapGrid;
            mapGrid = [];
            for (let y = 0; y < rows; y++) {
                mapGrid[y] = [];
                for (let x = 0; x < cols; x++) {
                    mapGrid[y][x] = (oldGrid[y] && oldGrid[y][x]) ? oldGrid[y][x] : 'vacio';
                }
            }
            drawMap();
        }

        window.addEventListener('resize', resizeCanvas);

        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.build-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // Renderizado completo del mapa en cuadrícula
        function drawMap() {
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let cellType = mapGrid[y][x];
                    let posX = x * tileSize;
                    let posY = y * tileSize;

                    // Dibujar fondo de celda
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(posX, posY, tileSize, tileSize);

                    // Si hay un edificio o carretera, dibujarlo
                    if (cellType !== 'vacio') {
                        ctx.fillStyle = buildingColors[cellType] || '#fff';
                        ctx.fillRect(posX + 2, posY + 2, tileSize - 4, tileSize - 4);
                        
                        // Detalle visual simple dentro del bloque
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.font = '10px sans-serif';
                        ctx.fillText(cellType.substring(0, 3).toUpperCase(), posX + 6, posY + 20);
                    }
                }
            }
        }

        // Interacción por clic: Traducir coordenadas de pantalla a la celda de la matriz
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            const gridX = Math.floor(clickX / tileSize);
            const gridY = Math.floor(clickY / tileSize);

            if (gridX >= 0 && gridX < cols && gridY >= 0 && gridY < rows) {
                mapGrid[gridY][gridX] = currentTool;
                drawMap();
            }
        });

        // Inicialización
        resizeCanvas();
    </script>
</body>
</html>
