<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Ecovia: Civilización Viva</title>
    <link rel='stylesheet' href='style.css'>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .main-container { display: flex; gap: 40px; justify-content: center; align-items: center; }
        .orb-card { width: 300px; height: 450px; background: #000; border: 2px solid #daa520; border-radius: 15px; box-shadow: 0 0 20px rgba(218, 165, 32, 0.3); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; box-sizing: border-box; }
        .orb-card img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .orb-label { background: rgba(0, 0, 0, 0.75); color: #daa520; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; text-transform: uppercase; position: relative; z-index: 1; border: 1px solid #daa520; }
        
        .main-menu-card { width: 350px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .logo-circle { width: 100px; height: 100px; border-radius: 50%; background: #000; border: 3px solid #daa520; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; box-shadow: 0 0 15px rgba(218, 165, 32, 0.5); overflow: hidden; }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .game-title { font-size: 48px; color: #0f0; text-transform: uppercase; margin: 0; letter-spacing: 2px; text-shadow: 0 0 10px #0f0; }
        .game-subtitle { font-size: 18px; color: #fff; margin-top: 5px; margin-bottom: 30px; opacity: 0.8; }
        
        .menu-button { width: 100%; padding: 15px; margin-bottom: 15px; background: transparent; border: 2px solid #daa520; color: #daa520; font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: all 0.3s; border-radius: 5px; box-sizing: border-box; }
        .menu-button:hover { background: #daa520; color: #000; box-shadow: 0 0 15px rgba(218, 165, 32, 0.7); }
        
        /* Selector de idiomas ampliado y ordenado */
        .language-selector { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 500px; }
        .lang-btn { background: transparent; border: 1px solid #daa520; color: #daa520; padding: 5px 8px; cursor: pointer; opacity: 0.7; font-size: 12px; border-radius: 3px; }
        .lang-btn:hover, .lang-btn.active { background: #daa520; color: #000; opacity: 1; }

        /* Tienda Amazon */
        #amazon-shop-ui { position: fixed; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 10px; z-index: 9999; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 200px; }
        #amazon-shop-ui h4 { margin: 0 0 10px 0; font-size: 14px; text-align: center; }
        #amazon-shop-ui .shop-buttons { display: flex; flex-direction: column; gap: 8px; }
        #amazon-shop-ui .shop-buttons button { width: 100%; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; }
        .btn-starter { background: #2ecc71; }
        .btn-energy { background: #3498db; }
        .btn-skin { background: #9b59b6; }
    </style>
</head>
<body>

    <div class='language-selector'>
        <button class='lang-btn active'>ES</button>
        <button class='lang-btn'>EUS</button>
        <button class='lang-btn'>EN</button>
        <button class='lang-btn'>CAT</button>
        <button class='lang-btn'>GLG</button>
        <button class='lang-btn'>VAL</button>
        <button class='lang-btn'>DE</button>
    </div>

    <div class='main-container'>
        <div class='orb-card'><div style="background:#111; width:100%; height:100%;"></div>
            <img src='fotaza.jpg' alt='Orbe Ecovia' style='width:100%; height:100%; object-fit: cover; position: absolute; top: 0; left: 0;'>
            <div class='orb-label'>NÚCLEO: BIOSFERA VIVA</div>
        </div>

        <div class='main-menu-card'>
            <div class='logo-circle'><div style="background:#111; width:100%; height:100%;"></div>
                <img src='logo.jpg' alt='Ecovia Logo' style='width:100%; height:100%; object-fit: cover;'>
            </div>
            <h1 class='game-title'>ECOVIA</h1>
            <p class='game-subtitle'>CIVILIZACIÓN VIVA</p>
            
            <button class='menu-button' onclick="location.href='gestion.html'">Iniciar Partida</button>
            <button class='menu-button'>Continuar</button>
            <button class='menu-button'>Ajustes</button>
        </div>

        <div class='orb-card'><div style="background:#111; width:100%; height:100%;"></div>
            <img src='fotaza.jpg' alt='Orbe Ecovia' style='width:100%; height:100%; object-fit: cover; position: absolute; top: 0; left: 0;'>
            <div class='orb-label'>RED CUÁNTICA CENTRAL</div>
        </div>
    </div>

    <div id='amazon-shop-ui'>
        <h4>🛒 Tienda Ecovia (Amazon)</h4>
        <div class='shop-buttons'>
            <button class='btn-starter' onclick="comprarProductoAmazon('ecovia.pack.starter')">Paquete Arranque</button>
            <button class='btn-energy' onclick="comprarProductoAmazon('ecovia.boost.autoenergy')">Energía Automática</button>
            <button class='btn-skin' onclick="comprarProductoAmazon('ecovia.skin.biomes')">Pase Diseñador</button>
        </div>
    </div>

    <script src='tienda.js'></script>

    <script>
        const traducciones = {
            'ES': { partida: 'Iniciar Partida', continuar: 'Continuar', ajustes: 'Ajustes', biosfera: 'NÚCLEO: BIOSFERA VIVA', cuantica: 'RED CUÁNTICA CENTRAL' },
            'EUS': { partida: 'Partida Hasi', continuar: 'Jarraitu', ajustes: 'Ezarpenak', biosfera: 'NUKLEOA: BIZI BIOSFERA', cuantica: 'SARE KUANTIKO NAGusia' },
            'EN': { partida: 'Start Game', continuar: 'Continue', ajustes: 'Settings', biosfera: 'CORE: LIVING BIOSPHERE', cuantica: 'CENTRAL QUANTUM NETWORK' },
            'CAT': { partida: 'Iniciar Partida', continuar: 'Continuar', ajustes: 'Ajustaments', biosfera: 'NUCLEU: BIOSFERA VIVA', cuantica: 'XARXA QUÀNTICA CENTRAL' },
            'GLG': { partida: 'Iniciar Partida', continuar: 'Continuar', ajustes: 'Axustes', biosfera: 'NÚCLEO: BIOSFERA VIVA', cuantica: 'REDE CUÁNTICA CENTRAL' },
            'VAL': { partida: 'Iniciar Partida', continuar: ' Continuar', ajustes: 'Ajusts', biosfera: 'NUCLEU: BIOSFERA VIVA', cuantica: 'XARXA QUÀNTICA CENTRAL' },
            'DE': { partida: 'Spiel Starten', continuar: 'Fortsetzen', ajustes: 'Einstellungen', biosfera: 'KERN: LEBENDE BIOSPHÄRE', cuantica: 'ZENTRALES QUANTENNETZWERK' }
        };

        function cambiarIdioma(lang, btnElement) {
            // Actualizar botones activos
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            // Traducir textos principales si existen en el diccionario
            const t = traducciones[lang];

            const btnPartida = document.querySelector('button[onclick*="gestion.html"]');
            if (btnPartida) btnPartida.innerText = t.partida;

            const botonesMenu = document.querySelectorAll('.main-menu-card .menu-button');
            if (botonesMenu.length >= 3) {
                botonesMenu[0].innerText = t.partida;
                botonesMenu[1].innerText = t.continuar;
                botonesMenu[2].innerText = t.ajustes;
            }

            const labels = document.querySelectorAll('.orb-label');
            if (labels.length >= 2) {
                labels[0].innerText = t.biosfera;
                labels[1].innerText = t.cuantica;
            }
        }

        // Asignar eventos a los botones de idioma automáticamente
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                cambiarIdioma(e.target.innerText.trim(), e.target);
            });
        });
    </script>
</body>
</html>
